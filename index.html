<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Monézia</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Monézia">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#000;--card:#111113;--soft:#1b1b1e;--line:#2a2a2e;--ink:#fff;--mute:#8b8b92;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--ink);font:500 15px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"tnum" 1;letter-spacing:-.01em;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit}
[hidden]{display:none!important}
h2{margin:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--mute)}
.app{max-width:460px;margin:0 auto;padding:10px 16px 14px;display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
body.d .app{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}

header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 12px;flex:none}
.logo{font-size:24px;font-weight:800;letter-spacing:-.045em;color:#fff}
.logo small{font-size:11px;font-weight:500;letter-spacing:0;color:var(--mute);margin-left:4px}
.hb{display:flex;gap:8px;align-items:center}
.ib,.pill{height:40px;border:0;background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib{width:40px;border-radius:50%}
.ib.on{background:#fff;color:#000}
.pill{gap:7px;border-radius:999px;padding:0 16px;font:600 13px Inter,sans-serif}
.ib svg,.pill svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

#dep:not([hidden]){flex:1;display:flex;flex-direction:column;min-height:0}
.hero{flex:none;background:var(--card);border-radius:24px;padding:16px 18px}
.big{font-size:clamp(36px,6.4vh,56px);font-weight:700;letter-spacing:-.05em;line-height:1.05;margin:4px 0 12px}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#fff;border-radius:6px;transition:width .5s}
.bar i.low{background:repeating-linear-gradient(45deg,#fff 0 5px,#6b6b70 5px 10px)}
.meta{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:600}
.envs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.envs:empty{display:none}
.chip{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:6px 12px;font:500 12.5px Inter,sans-serif;cursor:pointer}
.chip b{color:var(--ink);font-weight:700}.chip.zero b{color:var(--mute);font-weight:500}

.entry,.hist{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:12px}
.seg{position:relative;flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:16px;padding:4px}
.thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:12px;background:#fff;transition:transform .32s cubic-bezier(.3,1.2,.5,1)}
.ty{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;height:40px;border:0;background:none;color:var(--mute);font:600 13.5px Inter,sans-serif;cursor:pointer;transition:color .2s}
.ty.on{color:#000}
.ty svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.amtrow{position:relative;flex:1 1 auto;min-height:58px;display:flex;align-items:center;justify-content:center;gap:4px}
.amtrow input{width:176px;border:0;background:transparent;color:var(--ink);font:700 clamp(40px,7vh,66px) Inter,sans-serif;letter-spacing:-.05em;text-align:right;padding:0;outline:none;cursor:default}
.amtrow input::placeholder{color:#3a3a3f;opacity:1}
.amtrow>span{font:700 clamp(40px,7vh,66px) Inter,sans-serif;letter-spacing:-.05em;color:var(--mute);margin-left:6px}
.back{position:absolute;left:0;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.back svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back:active{background:var(--soft)}
.hint{flex:none;text-align:center;color:var(--mute);font-size:12.5px;min-height:18px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint b{color:var(--ink);font-weight:600}
.keys{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{height:clamp(34px,5.8vh,62px);border:0;border-radius:16px;background:var(--card);color:var(--ink);font:500 24px Inter,sans-serif;cursor:pointer}
.k:active{background:var(--soft)}
.k[data-k="b"]{color:var(--mute)}
.go{flex:none;margin-top:10px;width:100%;height:clamp(48px,6.4vh,58px);border:0;border-radius:18px;background:#fff;color:#000;font:700 17px Inter,sans-serif;cursor:pointer}
.go:active{background:#d9d9dc}

.hscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:15px}
.row small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.row>div:first-child{min-width:0}
.row>div:last-child{display:flex;align-items:center;white-space:nowrap;flex:none;text-align:right}
.row>div:last-child small{display:block}
.x{border:0;background:none;color:var(--mute);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px}

@media (max-height:720px){
 header{padding:0 0 8px}
 .hero{padding:12px 16px;border-radius:20px}
 .big{margin:2px 0 8px}
 .meta{margin-top:8px}
 .envs{margin-top:8px}.chip{padding:4px 10px}
 .entry,.hist{padding-top:8px}
 .ty{height:36px}
 .hint{margin-bottom:6px}
 .go{margin-top:8px;height:46px}
}
@media (max-height:640px){.meta{display:none}.bar{margin-top:8px}}

/* ---- Charges fixes ---- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border-radius:20px;padding:14px 16px}
.val{display:flex;align-items:baseline;margin-top:6px}
.val input{border:0;background:transparent;color:var(--ink);font:700 28px Inter,sans-serif;letter-spacing:-.04em;padding:0;outline:none;min-width:0}
.val>span{font:700 28px Inter,sans-serif;color:var(--mute);margin-left:2px}
.pen{margin-left:auto;align-self:center;border:0;background:none;color:var(--mute);cursor:pointer;padding:4px}
.pen svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sum{font-size:12.5px;color:var(--mute);margin:0 4px 12px}.sum b{color:var(--ink);font-weight:600}
.list{background:var(--card);border-radius:20px;padding:4px 14px 14px;margin-bottom:12px}
.lh,.cr{display:grid;grid-template-columns:34px 1fr 84px 28px;gap:6px;align-items:center}
.lh{padding:12px 0 6px}
.lh h2:nth-child(3){text-align:right}
.cr{border-top:1px solid var(--line);min-height:52px}
.cr input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px Inter,sans-serif;padding:10px 0;outline:none}
.cr .d{color:var(--mute)}
.eu{display:flex;align-items:baseline;justify-content:flex-end}.eu input{width:auto;text-align:right}.eu span{color:var(--mute)}
.env{font-size:11px;color:var(--mute);margin-top:-6px;padding-bottom:7px}.env.zero{color:var(--ink);font-weight:600}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.add{width:100%;margin-top:10px;height:44px;border-radius:14px;border:1.5px dashed var(--line);background:none;color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer}
.acts{display:flex;gap:10px}
.acts button{flex:1;height:50px;border-radius:16px;font:700 16px Inter,sans-serif;cursor:pointer}
.sv{background:#fff;color:#000;border:0}
.rs{background:transparent;color:#fff;border:1.5px solid var(--line)}
.rs[data-s]{background:#fff;color:#000;border-color:#fff}
.ok{text-align:center;color:var(--mute);min-height:22px;margin-top:10px;font-size:13px}
</style>
</head>
<body class="d">
<div class="app">
<header>
 <div class="logo">Monézia<small>1.0</small></div>
 <div class="hb"><button class="ib" id="hico" aria-label="Historique"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg></button><button class="pill" id="nav" aria-label="Changer d’écran"></button></div>
</header>

<section id="dep">
 <div class="hero">
  <h2>Reste ce mois</h2>
  <div class="big" id="reste">0 €</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="meta"><span>Utilisé <b id="spent">0 €</b></span><span>Base <b id="base">0 €</b></span></div>
  <div class="envs" id="envs"></div>
 </div>

 <div class="entry" id="entry">
  <div class="seg" id="seg"><i class="thumb" id="thumb"></i>
   <button class="ty on" data-ty="panier"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>Panier</button>
   <button class="ty" data-ty="coiffeur"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="6" cy="17" r="2.5"/><path d="M8 8.5L21 17M8 15.5L21 7"/></svg>Coiffeur</button>
   <button class="ty" data-ty="essence"><svg viewBox="0 0 24 24"><path d="M5 20V5h9v15M3 20h13M14 9h3l2 2v7a1.5 1.5 0 0 1-3 0v-3"/></svg>Essence</button>
  </div>
  <div class="amtrow"><button class="back" id="back" aria-label="Retour : effacer le dernier chiffre"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button><input id="amt" type="text" inputmode="none" readonly placeholder="0" aria-label="Montant en euros"><span>€</span></div>
  <div class="hint" id="hint"></div>
  <div class="keys"><button class="k" data-k="1">1</button><button class="k" data-k="2">2</button><button class="k" data-k="3">3</button><button class="k" data-k="4">4</button><button class="k" data-k="5">5</button><button class="k" data-k="6">6</button><button class="k" data-k="7">7</button><button class="k" data-k="8">8</button><button class="k" data-k="9">9</button><button class="k" data-k=",">,</button><button class="k" data-k="0">0</button><button class="k" data-k="b" aria-label="Effacer">⌫</button></div>
 </div>

 <div class="hist" id="hcard" hidden>
  <h2>Historique</h2>
  <div class="hscroll"><div id="hist"></div><div id="arch"></div></div>
 </div>
 <button class="go" id="go">Ajouter</button>
</section>

<section id="fix" hidden>
 <div class="two">
  <div class="stat"><h2>Capital mensuel</h2><div class="val"><input id="cap" type="number" inputmode="decimal" aria-label="Capital mensuel"><span>€</span><button class="pen" id="pc" aria-label="Modifier le capital"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg></button></div></div>
  <div class="stat"><h2>Épargne</h2><div class="val"><input id="epa" type="number" inputmode="decimal" aria-label="Épargne"><span>€</span><button class="pen" id="pe" aria-label="Modifier l’épargne"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg></button></div></div>
 </div>
 <div class="sum" id="sum"></div>
 <div class="list">
  <div class="lh"><h2>Jour</h2><h2>Charge</h2><h2>Montant</h2><span></span></div>
  <div id="tb"></div>
  <button class="add" id="addc">+ Ajouter une charge fixe</button>
 </div>
 <div class="acts"><button class="sv" id="save">Sauvegarder</button><button class="rs" id="reset">Reset</button></div>
 <div class="ok" id="ok"></div>
</section>
</div>
<script>
const KEY="monezia-v1";
const def={capital:1764,epargne:250,charges:[[1,"Coiffeur",25],[3,"Virement",470],[4,"Apple Music",17],[5,"Assurance Auto",115],[5,"Mutuelle",55],[6,"Plein",200],[8,"Apple stockage",3],[10,"Forfait ligne perso / ligne pro",12],[10,"Crédit Voiture",0],[16,"Banque",12],[28,"Netflix",8],[30,"Suno",10]].map(c=>({d:c[0],n:c[1],a:c[2],done:false})),dep:[]};
function norm(s){
 const d=JSON.parse(JSON.stringify(def));
 if(!s||typeof s!=="object")return Object.assign(d,{archive:[]});
 const n=(v,f)=>isNaN(parseFloat(v))?f:parseFloat(v);
 return{capital:n(s.capital,d.capital),epargne:n(s.epargne,d.epargne),charges:Array.isArray(s.charges)?s.charges:d.charges,dep:Array.isArray(s.dep)?s.dep:[],archive:Array.isArray(s.archive)?s.archive:[]};
}
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}return norm(s)}
let S=load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
let type="panier";
const $=id=>document.getElementById(id);
const eur=n=>(Math.round(n*100)/100).toLocaleString("fr-FR")+" €";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const fixTotal=()=>S.charges.reduce((t,c)=>t+(+c.a||0),0);
const base=()=>S.capital-S.epargne-fixTotal();
const ENV={essence:/plein|carburant|essence/i,coiffeur:/coiffeur/i},NAME={essence:"Plein",coiffeur:"Coiffeur"};
const envType=c=>Object.keys(ENV).find(t=>ENV[t].test(c.n))||null;
function envState(t){const tot=S.charges.reduce((x,c)=>x+(envType(c)===t?(+c.a||0):0),0);let left=tot;const rows={};S.dep.forEach(d=>{if(d.type===t){const f=Math.max(0,Math.min(d.a,left));left-=f;rows[d.id]={from:f,over:d.a-f}}});return{tot,left,rows}}
const spent=()=>S.dep.reduce((t,d)=>t+d.a,0)-Object.keys(ENV).reduce((t,k)=>{const e=envState(k);return t+e.tot-e.left},0);
const reste=()=>base()-spent();

function envNote(c,i){
 const t=envType(c);if(!t)return"";
 const e=envState(t);let used=e.tot-e.left,rem=+c.a||0;
 for(let k=0;k<S.charges.length;k++){const x=S.charges[k];if(envType(x)!==t)continue;const a=+x.a||0,u=Math.min(used,a);used-=u;if(k===i){rem=a-u;break}}
 return `<div class="env${rem<=0?" zero":""}">${rem<=0?"Épuisé":"Reste "+eur(rem)} sur ${eur(+c.a||0)}</div>`;
}
function render(){
 const b=base(),r=reste(),sp=spent(),p=b>0?Math.max(0,Math.min(1,r/b)):0;
 $("base").textContent=eur(b);$("reste").textContent=eur(r);$("spent").textContent=eur(sp);
 $("bar").style.width=(p*100)+"%";$("bar").classList.toggle("low",p<.1);
 $("sum").innerHTML=`<b>${eur(b)}</b> de base = ${eur(S.capital)} − ${eur(S.epargne)} − ${eur(fixTotal())} de charges`;
 $("envs").innerHTML=["essence","coiffeur"].map(t=>{const e=envState(t);return e.tot?`<button class="chip${e.left<=0?" zero":""}" data-ty2="${t}">${NAME[t]}<b>${e.left<=0?"épuisé":eur(e.left)}</b></button>`:""}).join("");
 $("cap").value=S.capital;$("epa").value=S.epargne;[$("cap"),$("epa")].forEach(i=>i.style.width=(String(i.value).length+.5)+"ch");
 $("tb").innerHTML=S.charges.map((c,i)=>`<div class="cr"><input class="d" data-i="${i}" data-f="d" type="number" inputmode="numeric" value="${c.d}" aria-label="Jour"><div><input data-i="${i}" data-f="n" value="${esc(c.n)}" aria-label="Nom">${envNote(c,i)}</div><div class="eu"><input data-i="${i}" data-f="a" type="number" inputmode="decimal" value="${c.a}" style="width:${Math.max(2,String(c.a).length)+.4}ch" aria-label="Montant"><span>€</span></div><button class="x" data-del="${i}" aria-label="Supprimer">×</button></div>`).join("");
 const envE={essence:envState("essence"),coiffeur:envState("coiffeur")},envLabel=d=>{const E=envE[d.type];if(!E||!E.tot)return"";const r=E.rows[d.id],N=NAME[d.type];return r.over<=0?" · pris sur "+N:r.from>0?" · "+eur(r.from)+" sur "+N+", "+eur(r.over)+" du budget":" · "+N+" épuisé, du budget"};
 const L={panier:"Panier",coiffeur:"Coiffeur",essence:"Essence"};
 $("hist").innerHTML=S.dep.length?S.dep.slice().reverse().map(d=>`<div class="row"><div>${L[d.type]}<small>${d.date}${envLabel(d)}</small></div><div>−${eur(d.a)}<button class="x" data-rm="${d.id}" aria-label="Supprimer">×</button></div></div>`).join(""):'<p style="color:var(--mute);font-size:14px;margin:14px 2px">Aucune dépense pour l’instant.</p>';
 $("arch").innerHTML=S.archive.length?'<h2 style="margin:22px 0 2px">Mois précédents</h2>'+S.archive.slice().reverse().map(m=>`<div class="row"><div>${esc(m.label)}<small>${m.n} dépense${m.n>1?"s":""}</small></div><div style="text-align:right">−${eur(m.spent)}<small>sur ${eur(m.base)}</small></div></div>`).join(""):"";
 hint();
}
function hint(){
 const v=parseFloat($("amt").value)||0,h=$("hint");
 if(ENV[type]){const e=envState(type),N=NAME[type];if(!e.tot)h.innerHTML=`Reste disponible : <b>${eur(reste()-v)}</b>`;else{const cov=Math.min(v,e.left),over=v-cov;h.innerHTML=over>0?`${N} vide · budget reste <b>${eur(reste()-over)}</b>`:`${N} : reste <b>${eur(e.left-cov)}</b>`}}
 else h.innerHTML=`Déduit du budget · reste <b>${eur(reste()-v)}</b>`;
}
const NAV_FIX='Charges fixes <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>',NAV_BACK='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg> Retour';
let screen="dep";
function show(s){screen=s;if(s!=="dep")setHist(false);$("dep").hidden=s!=="dep";$("fix").hidden=s!=="fix";$("hico").hidden=s!=="dep";document.body.classList.toggle("d",s==="dep");$("nav").innerHTML=s==="dep"?NAV_FIX:NAV_BACK;scrollTo(0,0);if(s==="dep")moveThumb()}
$("nav").onclick=()=>show(screen==="dep"?"fix":"dep");
function moveThumb(){const b=[...document.querySelectorAll(".ty")],i=Math.max(0,b.findIndex(x=>x.classList.contains("on")));$("thumb").style.transform="translateX("+i*100+"%)"}
function selType(t){type=t;document.querySelectorAll(".ty").forEach(x=>x.classList.toggle("on",x.dataset.ty===t));moveThumb();hint()}
document.querySelectorAll(".ty").forEach(t=>t.onclick=()=>selType(t.dataset.ty));
$("envs").onclick=e=>{const c=e.target.closest(".chip");if(c){setHist(false);selType(c.dataset.ty2)}};
document.querySelectorAll(".k").forEach(k=>k.onclick=()=>{const a=$("amt");let v=a.value;const d=k.dataset.k;if(d==="b")v=v.slice(0,-1);else if(d===","){if(v&&!v.includes("."))v+="."}else if(v.length<7)v+=d;a.value=v;hint()});
$("go").onclick=()=>{
 if(!$("hcard").hidden){setHist(false);return}
 const a=parseFloat($("amt").value);
 if(!(a>=0)||isNaN(a)){$("hint").textContent="Saisis un montant pour l’ajouter.";return}
 S.dep.push({id:Date.now(),type,a,date:new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})});
 $("amt").value="";
 save();render();
 if(ENV[type]){const e=envState(type),N=NAME[type];$("hint").innerHTML=e.tot?(e.left>0?`Ajouté · ${N} reste <b>${eur(e.left)}</b>`:`Ajouté · ${N} vide · budget <b>${eur(reste())}</b>`):`Ajouté · reste disponible : <b>${eur(reste())}</b>`}
};
function setHist(o){$("hcard").hidden=!o;$("entry").hidden=o;$("hico").classList.toggle("on",o);$("go").textContent=o?"Nouvelle dépense":"Ajouter";if(!o)moveThumb()}
$("hico").onclick=()=>setHist($("hcard").hidden);
$("back").onclick=()=>{
 const a=$("amt");
 if(a.value){a.value=a.value.slice(0,-1);hint();return}
 const d=S.dep[S.dep.length-1];if(!d)return;
 S.dep.pop();save();
 a.value=String(d.a);render();selType(d.type);
 $("hint").textContent="Reprise · modifie puis Ajoute";
};
$("hist").onclick=e=>{const id=e.target.dataset.rm;if(!id)return;S.dep=S.dep.filter(x=>x.id!=id);save();render()};
$("tb").onchange=e=>{const t=e.target,i=t.dataset.i;if(i==null)return;const f=t.dataset.f;S.charges[i][f]=f==="n"?t.value:(parseFloat(t.value)||0);save();render()};
$("tb").onclick=e=>{const i=e.target.dataset.del;if(i==null)return;S.charges.splice(i,1);save();render()};
$("addc").onclick=()=>{S.charges.push({d:1,n:"Nouvelle charge",a:0,done:false});save();render()};
$("pc").onclick=()=>$("cap").focus();$("pe").onclick=()=>$("epa").focus();
$("cap").onchange=e=>{S.capital=parseFloat(e.target.value)||0;save();render()};
$("epa").onchange=e=>{S.epargne=parseFloat(e.target.value)||0;save();render()};
$("save").onclick=()=>{save();$("ok").textContent="Enregistré ✓";setTimeout(()=>$("ok").textContent="",2000)};
$("reset").onclick=()=>{if(!$("reset").dataset.s){$("reset").dataset.s=1;$("reset").textContent="Confirmer ?";setTimeout(()=>{delete $("reset").dataset.s;$("reset").textContent="Reset"},3000);return}
 if(S.dep.length)S.archive.push({label:new Date(S.dep[0].id).toLocaleDateString("fr-FR",{month:"long",year:"numeric"}),base:base(),spent:spent(),n:S.dep.length,dep:S.dep});S.dep=[];S.charges.forEach(c=>c.done=false);delete $("reset").dataset.s;$("reset").textContent="Reset";save();render();$("ok").textContent="Mois archivé, compteur remis à zéro ✓";setTimeout(()=>$("ok").textContent="",2500)};
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
addEventListener("pagehide",save);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
render();show("dep");
</script>
</body>
</html>
