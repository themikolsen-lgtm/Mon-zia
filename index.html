<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121518">
<title>Monézia</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Monézia">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap">
<style>
:root{--bg:#121518;--card:#1c2024;--ink:#f1eef0;--mute:#8a949e;--g1:#7ed957;--g2:#c9e265;--red:#ff5757;--orange:#f59e0b;--line:#2c3238;--soft:#272d33;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
html,body{margin:0;min-height:100%;background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-weight:600}
[hidden]{display:none!important}
.app{max-width:460px;margin:0 auto;padding:10px 12px 14px;display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
body.d .app{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 10px;flex:none}
.logo{font-size:30px;font-style:italic;font-weight:700;color:#fff}
.logo small{font-size:12px;color:#8c93ff;-webkit-text-fill-color:#8c93ff;font-weight:500}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border:0;border-radius:999px;padding:9px 16px;font:700 13px Poppins,sans-serif;cursor:pointer}
.pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
h2{margin:0 0 6px;font-size:18px}
.card{background:var(--card);border-radius:24px;padding:14px;margin-bottom:12px}

/* ---- écran Dépenses : tout dans une seule carte ---- */
#dep:not([hidden]){flex:1;display:flex;flex-direction:column;min-height:0}
.card.main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 14px;margin-bottom:10px}
.card.main>h2{text-align:center;font-size:16px;margin:0 0 4px;flex:none}
.hico{position:absolute;top:10px;left:12px;border:0;background:none;color:var(--mute);cursor:pointer;padding:4px}
.hico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gauge{position:relative;flex:1 1 auto;min-height:84px;max-height:230px;margin:auto 0}
.gauge svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:calc(100% - 168px);max-width:260px;height:100%}
.gauge .s{position:absolute;bottom:0;text-align:center;font-size:14px;line-height:1.25;width:78px}
.gauge .s.l{left:0}.gauge .s.r{right:0}
.gauge .s b{display:block;font-size:20px;font-style:italic}
#needle{transform-origin:120px 120px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#arc{transition:stroke-dashoffset .6s,stroke .3s}
.amtbox,.hbox{position:relative;flex:none;height:clamp(118px,14vh,150px);margin-top:6px}
.types{position:absolute;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between}
.ty{width:38px;height:38px;padding:0;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.ty svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ptr{position:absolute;left:-20px;top:0;width:0;height:0;border:7px solid transparent;border-left:11px solid var(--g1);border-right:0;pointer-events:none}
.amt{position:absolute;inset:0 48px 0 0;display:flex;align-items:center;justify-content:center;gap:6px}
.amt input{width:130px;border:0;border-bottom:3px solid var(--ink);background:transparent;color:var(--ink);font:700 44px Poppins,sans-serif;text-align:right;padding:0 4px;outline:none;cursor:default}
.amt span{font:700 44px Poppins}
.back{position:absolute;left:2px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1}
.back svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back:active{background:var(--line)}
.hint{position:absolute;left:0;right:48px;bottom:0;padding:0 8px;text-align:center;color:var(--mute);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint b{color:var(--ink)}
.hbox{display:flex;flex-direction:column;flex:1 1 auto;height:auto;min-height:120px}
.card.main.hist .gauge{flex:0 0 112px;min-height:0;margin:0 0 4px}
.hico.on{color:var(--g1)}
.link{border:0;background:none;color:var(--ink);font:600 14px Poppins;cursor:pointer;margin:0 0 0 auto}
.hscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row small{color:var(--mute);font-weight:500;display:block}
.x{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.keys{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.k{height:clamp(34px,6.4vh,64px);border:1.5px solid var(--line);border-radius:16px;background:var(--soft);color:var(--mute);font:700 21px Poppins,sans-serif;cursor:pointer}
.k:active{background:var(--line)}
.go{flex:none;display:block;width:100%;height:clamp(44px,6vh,56px);border:0;border-radius:20px;background:#fff;color:#121518;font:700 20px Poppins,sans-serif;cursor:pointer}
.go:active{background:#e6e8ea}

/* ---- écran Charges fixes ---- */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font:500 14px Poppins,sans-serif}
th{font:500 12px Poppins,sans-serif;color:var(--mute);text-align:left;padding:4px}
th,td{border:0;border-bottom:1px solid var(--line);padding:2px 4px;text-align:left}
tbody tr:last-child td{border-bottom:0}
td input{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;padding:8px 4px;min-width:40px;outline:none}
td.c{text-align:center;width:34px}
.eu{display:flex;align-items:center}.eu input{min-width:0;padding-right:0}.eu span{color:var(--mute)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.env{font-size:11px;font-weight:600;color:var(--mute);padding:0 4px 2px;margin-top:-2px}.env.zero{color:var(--orange)}
.add{width:100%;margin-top:12px;border:0;border-radius:16px;height:44px;background:var(--soft);color:var(--g1);font:700 15px Poppins,sans-serif;cursor:pointer}
.two{display:flex;gap:12px}
.two .card{flex:1;padding:14px;margin-bottom:12px}
.lab{font:italic 700 14px Poppins;color:var(--g1)}
.val{display:flex;align-items:center;margin-top:4px}
.val input{border:0;background:transparent;color:var(--ink);font:italic 700 30px Poppins;padding:0;outline:none;min-width:0}
.val span{font:italic 700 30px Poppins}
.pen{margin-left:auto;border:0;background:none;color:var(--mute);cursor:pointer;padding:4px}
.pen svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;gap:12px}
.acts button{flex:1;height:46px;border:0;border-radius:18px;color:#fff;font:700 18px Poppins;cursor:pointer}
.sv{background:linear-gradient(90deg,var(--g1),var(--g2))}.rs{background:var(--red)}
.ok{text-align:center;color:var(--g1);min-height:22px;margin-top:10px;font-size:14px}
</style>
</head>
<body class="d">
<div class="app">
<header><div class="logo">Monézia <small>1.0</small></div><button class="pill" id="nav" aria-label="Changer d’écran"></button></header>

<section id="dep">
 <div class="card main">
  <button class="hico" id="hico" aria-label="Historique"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg></button>
  <h2>Aujourd’hui</h2>
  <div class="gauge">
   <div class="s l">Reste<b id="reste" style="color:var(--orange)">0 €</b></div>
   <svg viewBox="0 0 240 135" preserveAspectRatio="xMidYMax meet"><path d="M20 120A100 100 0 0 1 220 120" fill="none" stroke="var(--soft)" stroke-width="40"/><path id="arc" d="M20 120A100 100 0 0 1 220 120" fill="none" stroke="#7ed957" stroke-width="40" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/><g id="needle"><path d="M114 122L120 28L126 122Z" fill="var(--ink)" opacity=".85"/><circle cx="120" cy="120" r="9" fill="var(--ink)"/></g></svg>
   <div class="s r">Base<b id="base" style="color:#7ed957">0 €</b></div>
  </div>
  <div class="amtbox" id="amtbox">
   <div class="types"><i class="ptr" id="ptr"></i>
    <button class="ty on" data-ty="panier" aria-label="Panier"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg></button>
    <button class="ty" data-ty="coiffeur" aria-label="Coiffeur"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="6" cy="17" r="2.5"/><path d="M8 8.5L21 17M8 15.5L21 7"/></svg></button>
    <button class="ty" data-ty="essence" aria-label="Essence"><svg viewBox="0 0 24 24"><path d="M5 20V5h9v15M3 20h13M14 9h3l2 2v7a1.5 1.5 0 0 1-3 0v-3"/></svg></button>
   </div>
   <button class="back" id="back" aria-label="Retour : effacer le dernier chiffre"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
   <div class="amt"><input id="amt" type="text" inputmode="none" readonly placeholder="0" aria-label="Montant en euros"><span>€</span></div>
   <div class="hint" id="hint"></div>
  </div>
  <div class="hbox" id="hcard" hidden>
   <h2 style="margin:0 0 4px;font-size:16px">Historique</h2>
   <div class="hscroll"><div id="hist"></div><div id="arch"></div></div>
  </div>
  <div class="keys"><button class="k" data-k="1">1</button><button class="k" data-k="2">2</button><button class="k" data-k="3">3</button><button class="k" data-k="4">4</button><button class="k" data-k="5">5</button><button class="k" data-k="6">6</button><button class="k" data-k="7">7</button><button class="k" data-k="8">8</button><button class="k" data-k="9">9</button><button class="k" data-k=",">,</button><button class="k" data-k="0">0</button><button class="k" data-k="b" aria-label="Effacer">⌫</button></div>
 </div>
 <button class="go" id="go">Ajouter</button>
</section>

<section id="fix" hidden>
 <div class="card">
  <div class="scroll"><table><thead><tr><th>Date</th><th>Nom</th><th>Montant</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
  <button class="add" id="addc">+ Ajouter une charge fixe</button>
 </div>
 <div class="two">
  <div class="card"><div class="lab">Capital mensuel</div><div class="val"><input id="cap" type="number" inputmode="decimal" aria-label="Capital mensuel"><span>€</span><button class="pen" id="pc" aria-label="Modifier le capital"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg></button></div></div>
  <div class="card"><div class="lab">Épargne</div><div class="val"><input id="epa" type="number" inputmode="decimal" aria-label="Épargne"><span>€</span><button class="pen" id="pe" aria-label="Modifier l’épargne"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg></button></div></div>
 </div>
 <div class="acts"><button class="sv" id="save">Sauvegarder</button><button class="rs" id="reset">Reset</button></div>
 <div class="ok" id="ok"></div>
</section>
</div>
<script>
const KEY="monezia-v1";
const def={capital:1764,epargne:250,charges:[[1,"Coiffeur",25],[3,"Virement",470],[4,"Apple Music",17],[5,"Assurance Auto",115],[5,"Mutuelle",55],[6,"Plein",200],[8,"Apple stockage",3],[10,"Forfait ligne perso / ligne pro",12],[10,"Crédit Voiture",0],[16,"Banque",12],[28,"Netflix",8],[30,"Suno",10]].map(c=>({d:c[0],n:c[1],a:c[2],done:false})),dep:[]};
function norm(s){
 const d=JSON.parse(JSON.stringify(def));
 if(!s||typeof s!=="object")return Object.assign(d,{archive:[]});
 const n=(v,f)=>isNaN(parseFloat(v))?f:parseFloat(v);
 return{capital:n(s.capital,d.capital),epargne:n(s.epargne,d.epargne),charges:Array.isArray(s.charges)?s.charges:d.charges,dep:Array.isArray(s.dep)?s.dep:[],archive:Array.isArray(s.archive)?s.archive:[]};
}
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}return norm(s)}
let S=load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
let type="panier";
const $=id=>document.getElementById(id);
const eur=n=>(Math.round(n*100)/100).toLocaleString("fr-FR")+" €";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const fixTotal=()=>S.charges.reduce((t,c)=>t+(+c.a||0),0);
const base=()=>S.capital-S.epargne-fixTotal();
const ENV={essence:/plein|carburant|essence/i,coiffeur:/coiffeur/i},NAME={essence:"Plein",coiffeur:"Coiffeur"};
const envType=c=>Object.keys(ENV).find(t=>ENV[t].test(c.n))||null;
function envState(t){const tot=S.charges.reduce((x,c)=>x+(envType(c)===t?(+c.a||0):0),0);let left=tot;const rows={};S.dep.forEach(d=>{if(d.type===t){const f=Math.max(0,Math.min(d.a,left));left-=f;rows[d.id]={from:f,over:d.a-f}}});return{tot,left,rows}}
const spent=()=>S.dep.reduce((t,d)=>t+d.a,0)-Object.keys(ENV).reduce((t,k)=>{const e=envState(k);return t+e.tot-e.left},0);
const reste=()=>base()-spent();

function envNote(c,i){
 const t=envType(c);if(!t)return"";
 const e=envState(t);let used=e.tot-e.left,rem=+c.a||0;
 for(let k=0;k<S.charges.length;k++){const x=S.charges[k];if(envType(x)!==t)continue;const a=+x.a||0,u=Math.min(used,a);used-=u;if(k===i){rem=a-u;break}}
 return `<div class="env${rem<=0?" zero":""}">${rem<=0?"Épuisé":"Reste "+eur(rem)} sur ${eur(+c.a||0)}</div>`;
}
function render(){
 const b=base(),r=reste(),p=b>0?Math.max(0,Math.min(1,r/b)):0;
 $("base").textContent=eur(b);$("reste").textContent=eur(r);
 $("arc").style.strokeDashoffset=100-p*100;
 $("arc").style.stroke=p>.3?"#7ed957":p>.1?"#f59e0b":"#ff5757";
 $("reste").style.color=r<0?"var(--red)":"var(--orange)";
 $("needle").style.transform="rotate("+(p*180-90)+"deg)";
 $("cap").value=S.capital;$("epa").value=S.epargne;[$("cap"),$("epa")].forEach(i=>i.style.width=(String(i.value).length+.5)+"ch");
 $("tb").innerHTML=S.charges.map((c,i)=>`<tr><td style="width:48px"><input data-i="${i}" data-f="d" type="number" value="${c.d}"></td><td><input data-i="${i}" data-f="n" value="${esc(c.n)}">${envNote(c,i)}</td><td style="width:84px"><div class="eu"><input data-i="${i}" data-f="a" type="number" inputmode="decimal" value="${c.a}" style="width:${Math.max(2,String(c.a).length)+.6}ch"><span>€</span></div></td><td class="c"><button class="x" data-del="${i}" aria-label="Supprimer">×</button></td></tr>`).join("");
 const envE={essence:envState("essence"),coiffeur:envState("coiffeur")},envLabel=d=>{const E=envE[d.type];if(!E||!E.tot)return"";const r=E.rows[d.id],N=NAME[d.type];return r.over<=0?" · pris sur "+N:r.from>0?" · "+eur(r.from)+" sur "+N+", "+eur(r.over)+" du budget":" · "+N+" épuisé, du budget"};
 const L={panier:"Panier",coiffeur:"Coiffeur",essence:"Essence"};
 $("hist").innerHTML=S.dep.length?S.dep.slice().reverse().map(d=>`<div class="row"><div>${L[d.type]}<small>${d.date}${envLabel(d)}</small></div><div>−${eur(d.a)}<button class="x" data-rm="${d.id}" aria-label="Supprimer">×</button></div></div>`).join(""):'<p style="color:var(--mute);font-weight:500;font-size:14px">Aucune dépense pour l’instant. Ajoute la première ci-dessus.</p>';
 $("arch").innerHTML=S.archive.length?'<h2 style="margin:18px 0 6px">Mois précédents</h2>'+S.archive.slice().reverse().map(m=>`<div class="row"><div>${esc(m.label)}<small>${m.n} dépense${m.n>1?"s":""}</small></div><div style="text-align:right">−${eur(m.spent)}<small>sur ${eur(m.base)}</small></div></div>`).join(""):"";
 hint();
}
function hint(){
 const v=parseFloat($("amt").value)||0,h=$("hint");
 if(ENV[type]){const e=envState(type),N=NAME[type];if(!e.tot)h.innerHTML=`Reste disponible : <b>${eur(reste()-v)}</b>`;else{const cov=Math.min(v,e.left),over=v-cov;h.innerHTML=over>0?`${N} vide · budget reste <b>${eur(reste()-over)}</b>`:`${N} : reste <b>${eur(e.left-cov)}</b>`}}
 else h.innerHTML=`Déduit du budget · reste <b>${eur(reste()-v)}</b>`;
}
const NAV_FIX='Charges fixes <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.6" style="stroke-width:3.4;stroke-dasharray:3.7 3.76;stroke-linecap:butt"/><circle cx="12" cy="12" r="7.6" style="fill:currentColor;stroke:none"/><circle cx="12" cy="12" r="3" style="fill:var(--card);stroke:none"/></svg>',NAV_BACK='<svg viewBox="0 0 10 10" style="width:10px;height:10px;fill:currentColor;stroke:none"><path d="M8 1L2 5l6 4z"/></svg> Retour';
let screen="dep";
function show(s){screen=s;$("dep").hidden=s!=="dep";$("fix").hidden=s!=="fix";document.body.classList.toggle("d",s==="dep");$("nav").innerHTML=s==="dep"?NAV_FIX:NAV_BACK;scrollTo(0,0);if(s==="dep")movePtr()}
$("nav").onclick=()=>show(screen==="dep"?"fix":"dep");
function movePtr(){const b=[...document.querySelectorAll(".ty")],n=b.length;if(n<2)return;const st=b[1].offsetTop-b[0].offsetTop,sel=Math.max(0,b.findIndex(x=>x.classList.contains("on")));b.forEach((x,i)=>{const slot=((i-sel+1)%n+n)%n;x.style.transform="translateY("+(slot-i)*st+"px)"});$("ptr").style.top=(st+b[0].offsetHeight/2-7)+"px"}
movePtr();addEventListener("load",movePtr);addEventListener("resize",movePtr);
document.querySelectorAll(".ty").forEach(t=>t.onclick=()=>{type=t.dataset.ty;document.querySelectorAll(".ty").forEach(x=>x.classList.toggle("on",x===t));movePtr();hint()});
document.querySelectorAll(".k").forEach(k=>k.onclick=()=>{const a=$("amt");let v=a.value;const d=k.dataset.k;if(d==="b")v=v.slice(0,-1);else if(d===","){if(v&&!v.includes("."))v+="."}else if(v.length<7)v+=d;a.value=v;hint()});
$("go").onclick=()=>{
 const a=parseFloat($("amt").value);
 if(!(a>=0)||isNaN(a)){$("hint").textContent="Saisis un montant pour l’ajouter.";return}
 S.dep.push({id:Date.now(),type,a,date:new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})});
 $("amt").value="";
 save();render();
 if(ENV[type]){const e=envState(type),N=NAME[type];$("hint").innerHTML=e.tot?(e.left>0?`Ajouté · ${N} reste <b>${eur(e.left)}</b>`:`Ajouté · ${N} vide · budget <b>${eur(reste())}</b>`):`Ajouté · reste disponible : <b>${eur(reste())}</b>`}
};
function setHist(o){$("hcard").hidden=!o;$("amtbox").hidden=o;document.querySelector(".keys").hidden=o;document.querySelector(".card.main").classList.toggle("hist",o);$("hico").classList.toggle("on",o);if(!o)movePtr()}
$("hico").onclick=()=>setHist($("hcard").hidden);
$("back").onclick=()=>{
 const a=$("amt");
 if(a.value){a.value=a.value.slice(0,-1);hint();return}
 const d=S.dep[S.dep.length-1];if(!d)return;
 S.dep.pop();save();
 type=d.type;document.querySelectorAll(".ty").forEach(x=>x.classList.toggle("on",x.dataset.ty===type));movePtr();
 a.value=String(d.a);render();
 $("hint").textContent="Reprise · modifie puis Ajoute";
};
document.querySelectorAll("#go").forEach(b=>b.addEventListener("click",()=>setHist(false)));
$("hist").onclick=e=>{const id=e.target.dataset.rm;if(!id)return;const d=S.dep.find(x=>x.id==id);S.dep=S.dep.filter(x=>x.id!=id);save();render()};
$("tb").onchange=e=>{const t=e.target,i=t.dataset.i;if(i==null)return;const f=t.dataset.f;S.charges[i][f]=f==="done"?t.checked:f==="n"?t.value:(parseFloat(t.value)||0);save();render()};
$("tb").onclick=e=>{const i=e.target.dataset.del;if(i==null)return;S.charges.splice(i,1);save();render()};
$("addc").onclick=()=>{S.charges.push({d:1,n:"Nouvelle charge",a:0,done:false});save();render()};
$("pc").onclick=()=>$("cap").focus();$("pe").onclick=()=>$("epa").focus();
$("cap").onchange=e=>{S.capital=parseFloat(e.target.value)||0;save();render()};
$("epa").onchange=e=>{S.epargne=parseFloat(e.target.value)||0;save();render()};
$("save").onclick=()=>{save();$("ok").textContent="Enregistré ✓";setTimeout(()=>$("ok").textContent="",2000)};
$("reset").onclick=()=>{if(!$("reset").dataset.s){$("reset").dataset.s=1;$("reset").textContent="Confirmer ?";setTimeout(()=>{delete $("reset").dataset.s;$("reset").textContent="Reset"},3000);return}
 if(S.dep.length)S.archive.push({label:new Date(S.dep[0].id).toLocaleDateString("fr-FR",{month:"long",year:"numeric"}),base:base(),spent:spent(),n:S.dep.length,dep:S.dep});S.dep=[];S.charges.forEach(c=>c.done=false);delete $("reset").dataset.s;$("reset").textContent="Reset";save();render();$("ok").textContent="Mois archivé, compteur remis à zéro ✓";setTimeout(()=>$("ok").textContent="",2500)};
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
addEventListener("pagehide",save);

document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
render();show("dep");
</script>
</body>
</html>
